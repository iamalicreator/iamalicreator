<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#3d0a0e" stroke-width="1"/>
    </pattern>
    <g id="g-shield" fill="none" stroke="#ff3b47" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5 20 5.5v6c0 5-3.4 9.3-8 10.5C7.4 20.8 4 16.5 4 11.5v-6L12 2.5Z"/>
      <path d="m8.8 11.6 2.3 2.3 4.2-4.4"/>
    </g>
    <g id="g-target" fill="none" stroke="#ff3b47" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.6"/>
      <circle cx="12" cy="12" r="4.6"/>
      <circle cx="12" cy="12" r="1" fill="#ff3b47"/>
    </g>
    <g id="g-reply" fill="none" stroke="#ff3b47" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 21l2-5.6A8.5 8.5 0 1 1 21 11.5Z"/>
      <path d="M15.5 8.5 11 12l4.5 3.5"/>
    </g>
    <g id="g-radar" fill="none" stroke="#ff3b47" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="4.8"/>
      <path d="M12 12 18.5 5.5"/>
      <circle cx="16.6" cy="14.6" r="1.1" fill="#ff3b47"/>
    </g>
    <g id="g-download" fill="none" stroke="#ff3b47" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5v10.2m0 0 4-4m-4 4-4-4"/>
      <path d="M4 17.5v2.6a1.4 1.4 0 0 0 1.4 1.4h13.2a1.4 1.4 0 0 0 1.4-1.4v-2.6"/>
    </g>
    <g id="g-tag" fill="none" stroke="#ff3b47" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 3.5H11l9.5 9.5-7.5 7.5L3.5 11V3.5Z"/>
      <circle cx="8" cy="8" r="1.4"/>
      <path d="M6 18 18 6" stroke="#ffffff"/>
    </g>
    <g id="g-mail" fill="none" stroke="#ff3b47" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5.5" width="18" height="13" rx="2"/>
      <path d="m3.5 7 8.5 6 8.5-6"/>
    </g>
    <g id="g-music" fill="none" stroke="#ff3b47" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 18.2V6.8L20 5v11.2"/>
      <circle cx="6.8" cy="18.2" r="2.7"/>
      <circle cx="17.3" cy="16.2" r="2.7"/>
    </g>
  </defs>

  <rect width="1280" height="560" fill="#050505"/>
  <rect width="1280" height="560" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="-120" width="1280" height="110" fill="#ff2a35" opacity="0.045">
    <animate attributeName="y" values="-120;560" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- pulse behind cat -->
  <circle cx="640" cy="168" r="96" fill="none" stroke="#ff2a35" stroke-width="1.4" opacity="0.5">
    <animate attributeName="r" values="92;118;92" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.12;0.5" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="168" r="128" fill="none" stroke="#ff2a35" stroke-width="1" opacity="0.22">
    <animate attributeName="r" values="124;146;124" dur="4.4s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.05;0.22" dur="4.4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>

  <!-- radar, left -->
  <g transform="translate(196,168)">
    <circle r="86" fill="none" stroke="#571016" stroke-width="1.4"/>
    <circle r="58" fill="none" stroke="#571016" stroke-width="1.2"/>
    <circle r="30" fill="none" stroke="#571016" stroke-width="1.2"/>
    <g>
      <path d="M0 0 L0 -86 A86 86 0 0 1 60.8 -60.8 Z" fill="#ff2a35" opacity="0.20"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/>
    </g>
    <circle cx="40" cy="-34" r="4" fill="#ff3b47">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-48" cy="26" r="3.2" fill="#ff3b47">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.75s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#ff2a35"/>
  </g>

  <!-- equalizer, right -->
  <g transform="translate(1012,168)" fill="#ff2a35">
    <rect x="0"   y="-14" width="13" height="28" rx="4" opacity="0.85"><animate attributeName="height" values="28;74;28" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="-14;-37;-14" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="24"  y="-30" width="13" height="60" rx="4" opacity="0.6"><animate attributeName="height" values="60;26;60" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="-30;-13;-30" dur="0.95s" repeatCount="indefinite"/></rect>
    <rect x="48"  y="-22" width="13" height="44" rx="4" opacity="0.95"><animate attributeName="height" values="44;84;44" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="-22;-42;-22" dur="1.35s" repeatCount="indefinite"/></rect>
    <rect x="72"  y="-34" width="13" height="68" rx="4" opacity="0.55"><animate attributeName="height" values="68;30;68" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="-34;-15;-34" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect x="96"  y="-16" width="13" height="32" rx="4" opacity="0.8"><animate attributeName="height" values="32;64;32" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="-16;-32;-16" dur="1.25s" repeatCount="indefinite"/></rect>
    <rect x="120" y="-26" width="13" height="52" rx="4" opacity="0.65"><animate attributeName="height" values="52;24;52" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-26;-12;-26" dur="0.9s" repeatCount="indefinite"/></rect>
  </g>

  <!-- cat mark, centre -->
  <g transform="translate(640,168)">
    <path d="M-52 -18 L-58 -66 L-18 -46 A62 58 0 0 1 18 -46 L58 -66 L52 -18 A62 60 0 1 1 -52 -18 Z"
          fill="#0b0b0d" stroke="#ff2a35" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-50 -30 L-53 -56 L-30 -42 Z" fill="#ff8fa0" opacity="0.85"/>
    <path d="M50 -30 L53 -56 L30 -42 Z" fill="#ff8fa0" opacity="0.85"/>
    <g fill="#ffd23e">
      <ellipse cx="-24" cy="-6" rx="8.5" ry="9">
        <animate attributeName="ry" values="9;9;0.8;9;9" keyTimes="0;0.86;0.92;0.98;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="24" cy="-6" rx="8.5" ry="9">
        <animate attributeName="ry" values="9;9;0.8;9;9" keyTimes="0;0.86;0.92;0.98;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <path d="M-4 12 Q0 15.5 4 12 Q0 20 -4 12 Z" fill="#ff8fa0"/>
    <g stroke="#8a8f98" stroke-width="2" stroke-linecap="round">
      <path d="M-38 8 L-66 3"/><path d="M-38 17 L-64 19"/>
      <path d="M38 8 L66 3"/><path d="M38 17 L64 19"/>
    </g>
  </g>

  <!-- tiles row -->
  <g id="tiles">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.1s" begin="0.2s" repeatCount="indefinite"/>
        <rect x="172" y="330" width="96" height="96" rx="22" fill="#0d0d0f" stroke="#ff2a35" stroke-width="1.6"/>
        <use href="#g-shield" transform="translate(196,354) scale(2)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.5s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.4s" begin="0.45s" repeatCount="indefinite"/>
        <rect x="292" y="330" width="96" height="96" rx="22" fill="#0d0d0f" stroke="#ff2a35" stroke-width="1.6"/>
        <use href="#g-target" transform="translate(316,354) scale(2)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
        <rect x="412" y="330" width="96" height="96" rx="22" fill="#0d0d0f" stroke="#ff2a35" stroke-width="1.6"/>
        <use href="#g-reply" transform="translate(436,354) scale(2)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.5s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.6s" begin="0.95s" repeatCount="indefinite"/>
        <rect x="532" y="330" width="96" height="96" rx="22" fill="#0d0d0f" stroke="#ff2a35" stroke-width="1.6"/>
        <use href="#g-radar" transform="translate(556,354) scale(2)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
        <rect x="652" y="330" width="96" height="96" rx="22" fill="#0d0d0f" stroke="#ff2a35" stroke-width="1.6"/>
        <use href="#g-download" transform="translate(676,354) scale(2)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.5s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.0s" begin="1.45s" repeatCount="indefinite"/>
        <rect x="772" y="330" width="96" height="96" rx="22" fill="#0d0d0f" stroke="#ff2a35" stroke-width="1.6"/>
        <use href="#g-tag" transform="translate(796,354) scale(2)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.5s" begin="1.7s" repeatCount="indefinite"/>
        <rect x="892" y="330" width="96" height="96" rx="22" fill="#0d0d0f" stroke="#ff2a35" stroke-width="1.6"/>
        <use href="#g-mail" transform="translate(916,354) scale(2)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.95s" dur="0.5s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.3s" begin="1.95s" repeatCount="indefinite"/>
        <rect x="1012" y="330" width="96" height="96" rx="22" fill="#0d0d0f" stroke="#ff2a35" stroke-width="1.6"/>
        <use href="#g-music" transform="translate(1036,354) scale(2)"/></g></g>
  </g>

  <!-- bottom sweep -->
  <rect x="172" y="486" width="936" height="4" rx="2" fill="#2a0508"/>
  <rect x="172" y="486" width="936" height="4" rx="2" fill="#ff2a35">
    <animate attributeName="width" values="0;936" dur="2.6s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.7;0.85;1" dur="5.2s" begin="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="640" cy="526" r="3.4" fill="#ff2a35">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
